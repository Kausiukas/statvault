name: Daily Wiki Build-Up & Lore Dataslate Corpus

on:
  schedule:
    # Daily at 07:25 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      unit_slug:
        description: 'Target unit slug (optional, picks from backlog if omitted)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (validate without committing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-wiki-build:
    name: Build Lore Dataslate & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Schemas
        run: |
          npm ci
          npm run build --workspace=@statvault/schemas

      - name: Run Schema Corpus Pre-check
        run: npm run validate:data

      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Run Daily Wiki Builder
        id: builder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BUILDER_ARGS=""
          if [ -n "${{ inputs.unit_slug }}" ]; then
            BUILDER_ARGS="--unit ${{ inputs.unit_slug }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            BUILDER_ARGS="$BUILDER_ARGS --dry-run"
          fi
          echo "Executing daily-wiki-builder with args: $BUILDER_ARGS"
          npx ts-node scripts/daily-wiki-builder.ts $BUILDER_ARGS

      - name: Run Full Corpus Schema Validation
        run: npm run validate:data

      - name: Detect Changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & Push Corpus Growth Directly to main
        if: steps.git_status.outputs.has_changes == 'true' && inputs.dry_run != true
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "lore: daily wiki corpus ingestion [${{ steps.date.outputs.date }}]"
          git push origin main
          echo "Successfully committed and pushed new corpus dataslates directly to main."
