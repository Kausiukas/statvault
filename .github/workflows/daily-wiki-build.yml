name: Daily Wiki Build-Up & Lore Dataslate Corpus

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      unit_slug:
        description: 'Target unit slug (optional, picks from backlog if omitted)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (validate without committing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-wiki-build:
    name: Build Lore Dataslate & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Schemas
        run: |
          npm ci
          npm run build --workspace=@statvault/schemas

      - name: Run Schema Corpus Pre-check
        run: npm run validate:data

      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Run Daily Wiki Builder
        id: builder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          BUILDER_ARGS=""
          if [ -n "${{ inputs.unit_slug }}" ]; then
            BUILDER_ARGS="--unit ${{ inputs.unit_slug }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            BUILDER_ARGS="$BUILDER_ARGS --dry-run"
          fi
          echo "Executing daily-wiki-builder with args: $BUILDER_ARGS"
          npx ts-node scripts/daily-wiki-builder.ts $BUILDER_ARGS

      - name: Run Full Corpus Schema Validation
        run: npm run validate:data

      - name: Detect Changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Reviewable Pull Request
        if: steps.git_status.outputs.has_changes == 'true' && inputs.dry_run != true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "lore: daily wiki corpus ingestion [${{ steps.date.outputs.date }}]"
          branch: "lore/wiki-${{ steps.date.outputs.date }}"
          branch-suffix: "timestamp"
          delete-branch: true
          base: main
          title: "⚔️ [Corpus Ingestion] Daily Lore Dataslate Addition (${{ steps.date.outputs.date }})"
          body: |
            ## Summary
            Automated daily StatVault corpus addition. Pulls new units, weapons, lore citations, and artifact links into the database.

            ### Scope
            - Autonomous corpus build-up only (no game patch diffs or comparisons).
            - Canonical lore grounding from verified Black Library, Codex, and Imperial Armor publications.
            - RTS baseline parameter derivation via Dual-Lens framework formulas.

            ### Schema Validation Status
            - [x] `npm run validate:data` passed on 100% of corpus files.
            - [x] Zod schemas satisfied across units, weapons, and lore annotations.

            ---
            *Note: As per repository guidelines in [CONTRIBUTING.md](CONTRIBUTING.md), this pull request requires human lore and tactical balance review before merging. Never auto-merged.*
          labels: |
            lore
            dataslate
            automated-pr
          reviewers: Kausiukas
