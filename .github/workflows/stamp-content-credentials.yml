name: Stamp Content Credentials & Provenance (C2PA/XMP)

on:
  workflow_run:
    workflows: ["Generate Visual Assets Suite (Meshy API)"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp-credentials:
    name: Stamp C2PA & Provenance Metadata
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Schemas
        run: |
          npm ci
          npm run build --workspace=@statvault/schemas

      - name: Stamp Credentials on Visual Assets
        run: |
          echo "Executing stamp-c2pa-credentials.ts..."
          npx ts-node scripts/stamp-c2pa-credentials.ts

      - name: Detect Metadata Changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain assets/art/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & Push Stamped Assets Directly to main
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/art/
          git commit -m "asset(provenance): stamp C2PA and marketing.ekopolimeras.com credentials"
          git push origin main
          echo "Successfully committed and pushed stamped assets directly to main."