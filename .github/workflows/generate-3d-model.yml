name: Generate 3D Model & Visuals (Meshy API)

on:
  workflow_run:
    workflows: ["Daily Wiki Build-Up & Lore Dataslate Corpus"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      unit_slug:
        description: 'Unit slug (optional, auto-detects latest missing model if omitted)'
        required: false
        type: string
      custom_prompt:
        description: 'Optional custom text-to-3d prompt'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-3d-model:
    name: Generate Textured 3D Asset
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Schemas
        run: |
          npm ci
          npm run build --workspace=@statvault/schemas

      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Run Meshy 3D Generator
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.unit_slug }}" ]; then
            ARGS="--unit ${{ inputs.unit_slug }}"
          fi
          if [ -n "${{ inputs.custom_prompt }}" ]; then
            ARGS="$ARGS --prompt \"${{ inputs.custom_prompt }}\""
          fi
          echo "Executing generate-meshy-model with args: $ARGS"
          npx ts-node scripts/generate-meshy-model.ts $ARGS

      - name: Detect Changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain public/models/ assets/ data/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & Push 3D Assets Directly to main
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add public/models/ assets/ data/
          git commit -m "asset(3d): add generated 3D model & visuals [${{ steps.date.outputs.date }}]"
          git push origin main
          echo "Successfully committed and pushed generated 3D model & visuals directly to main."
