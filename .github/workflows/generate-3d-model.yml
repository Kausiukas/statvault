name: Generate Visual Assets Suite (Meshy API)

on:
  workflow_run:
    workflows: ["Daily Wiki Build-Up & Lore Dataslate Corpus"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      unit_slug:
        description: 'Unit slug (optional, auto-detects latest if omitted)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-visuals:
    name: Generate Multi-View & Concept Art Suite
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build Schemas
        run: |
          npm ci
          npm run build --workspace=@statvault/schemas

      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Run Meshy Daily Visual Suite Generator
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.unit_slug }}" ]; then
            ARGS="--unit ${{ inputs.unit_slug }}"
          fi
          echo "Executing generate-daily-visuals with args: $ARGS"
          npx ts-node scripts/generate-daily-visuals.ts $ARGS

      - name: Detect Changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain assets/ data/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & Push Visual Assets Directly to main
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/art/ data/
          git commit -m "asset(visuals): add unit multiview, weapon multiview, and concept art [${{ steps.date.outputs.date }}]"
          git push origin main
          echo "Successfully committed and pushed visual asset suite directly to main."
